[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minichem-mcp-tools"
version = "0.3.0"
description = "Portable three-layer chemistry toolbox for Gaussian-centered mechanism tasks."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "fastmcp>=2.0",
    "jsonschema>=4.0",
    "numexpr>=2.0",
    "packaging>=23.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
chemistry = [
    "ase>=3.22",
    "cclib>=1.8",
    "numpy>=1.26,<3",
    "qcelemental>=0.29",
    "rdkit",
    "scipy>=1.11",
    "sella>=2.3",
]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
semantic-search = ["numpy>=1.24", "onnxruntime>=1.17", "tokenizers>=0.15"]

[project.scripts]
minichem-mcp-server = "minichem_mcp_tools.server:main"
minichem-tool = "minichem_mcp_tools.tool_manager:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["minichem_toolbox*", "minichem_mcp_tools*"]

[tool.setuptools.package-data]
minichem_mcp_tools = ["tool_config.json"]
