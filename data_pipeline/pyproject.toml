[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chem-benchmark-pipeline"
version = "0.1.0"
description = "A provenance-first pipeline for constructing computational chemistry benchmarks."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "boto3>=1.34",
  "httpx>=0.27",
  "json-repair>=0.50",
  "jsonschema>=4.23",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "PyMuPDF>=1.24",
  "pypdf>=6.0",
  "PyYAML>=6.0",
  "rdkit>=2024.3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "vulture>=2.14",
]

[project.scripts]
chem-pipeline = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
