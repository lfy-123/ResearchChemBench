schema_version: 1

software:
  bagel:
    display_name: BAGEL
    installed_version: "1.2.2-3ubuntu1 (bfceffea)"
    operational_status: runnable_self_contained_mpich_runtime
    official_docs: [https://nubakery.org/, https://github.com/qsimulate-open/bagel]
    primary_task: calculate explicitly specified multireference state energies, analytical nuclear gradients and nonadiabatic coupling vectors
    task_types: [state-averaged CASSCF, XMS-CASPT2, analytical nuclear gradients, nonadiabatic couplings]
    inputs: [BAGEL JSON input with geometry basis active space state manifold method and derivative target]
    outputs: [state energies, convergence diagnostics, nuclear gradients, nonadiabatic coupling vectors]
    normal_markers: [METHOD CASSCF, METHOD FORCE, METHOD NACME, Second-order optimization converged]
    convergence_notes: Process completion is insufficient. Require convergence of the selected multireference calculation, verify the active space and state ordering, and preserve explicit target-state and basis choices.
    resource_notes: The local runtime is an Ubuntu 22.04 MPICH binary plus a cache-local library closure. Keep MPI ranks times BAGEL threads within cpu_cores; no system package or shared Conda dependency is required.
    known_errors:
      - [Could not find basis set, the JSON basis name was not resolved to the cached basis directory, use the configured wrapper and an installed explicit basis name]
      - [CBLAS parameter error, the selected active space or very small model is numerically invalid, validate electron count orbital partition basis and state manifold]
      - [Second-order optimization did not converge, the CASSCF reference failed its explicit thresholds, inspect iterations and revise the scientifically justified initial space or convergence plan]
      - [MPI library or Hydra launcher missing, only part of the cache-local runtime was migrated, copy the complete .software_cache/installations/bagel/1.2.2 directory]

  vaspkit:
    display_name: VASPKIT
    installed_version: "1.5.1"
    operational_status: runnable_local_nonredistributable_binary
    official_docs: [https://vaspkit.com/installation.html, https://vaspkit.com/tutorials.html, https://vaspkit.com/features.html]
    primary_task: prepare and post-process explicitly supplied VASP structure and electronic-result files
    task_types: [K-point meshes, crystal symmetry, band gaps, bands, density of states, charge and potential analysis]
    inputs: [POSCAR or CONTCAR and task-specific INCAR EIGENVAL DOSCAR OUTCAR PROCAR CHGCAR or LOCPOT files]
    outputs: [task-specific KPOINTS structures tables grids plots and stdout summaries]
    normal_markers: [VASPKIT Standard Edition 1.5.1, Summary, exit code 0]
    convergence_notes: Post-processing cannot establish convergence of the underlying VASP calculation. K-point density, cutoff, cell, electronic minimization, smearing, bands and energy references must be checked from the supplied calculation record.
    resource_notes: The binary is lightweight for the exposed tasks. Large volumetric and wavefunction files can require substantial memory; native jobs must retain explicit limits.
    known_errors:
      - [configuration file not found, HOME does not contain the configured .vaspkit file, restore CHEMGRAPH_VASPKIT_CONFIG and use the runtime profile]
      - [failed to read POTCAR, task 102 continued from KPOINTS generation into optional licensed-potential preparation, use the generated KPOINTS only and do not treat POTCAR generation as supported]
      - [required VASP file not found, the selected task needs a complete matching VASP result set, stage every task-specific file from the same calculation]
      - [illegal or unsupported argument, the selected task lacks command-line support or an option is invalid, use the documented native stdin mode only with an explicit reviewed input sequence]

  pyfrag:
    display_name: PyFrag
    installed_version: "2019.02 (v1.0.0 af2a122d)"
    operational_status: runnable_pinned_patched_source
    official_docs: [https://pyfragdocument.readthedocs.io/en/latest/, https://pyfragdocument.readthedocs.io/en/latest/install.html, https://github.com/TheoChem-VU/PyFrag]
    primary_task: calculate activation-strain analysis profiles from explicitly supplied molecular reaction paths using ORCA single-point energies
    task_types: [activation strain model, distortion interaction analysis, reaction path energy decomposition, fragment strain analysis]
    inputs: [PyFrag input specification, AMV or multi-XYZ reaction path, explicit fragment partitions and reference energies, ORCA method keywords]
    outputs: [fragment_energies.txt, fragment ORCA outputs, structured activation-strain summary and validation]
    normal_markers: [PyFrag finished. Have a nice day, ORCA TERMINATED NORMALLY, exit code 0]
    convergence_notes: PyFrag completion does not validate the underlying path, fragment definition, reference states, electronic-structure method, basis-set convergence, spin state or path sampling. Every ORCA child calculation must terminate normally and the decomposition identity must close within an explicit tolerance.
    resource_notes: The pinned standalone ORCA driver runs path points serially and launches three ORCA single points per frame. The public Action is bounded to 200 frames and one CPU core per ORCA call.
    known_errors:
      - [atom_list is undefined or path filename is split into characters, unpatched Python 3 tokenization is active, apply the tracked v1.0.0 compatibility patch]
      - [could not convert string final to float, the legacy parser is reading an ORCA 6 Total Energy heading, apply the tracked FINAL SINGLE POINT ENERGY parser patch]
      - [orca not found, the separately downloaded ORCA executable is absent from PATH, restore the ORCA and matching OpenMPI cache paths]
      - [incomplete fragment_energies table, one or more complex or isolated-fragment calculations failed, inspect every native output and correct the explicit path method charge spin or fragment settings]

  sisso:
    display_name: SISSO
    installed_version: "3.5 (bc18cae)"
    operational_status: runnable_pinned_source_build
    official_docs: [https://github.com/rouyang2017/SISSO, https://github.com/rouyang2017/SISSO/blob/master/SISSO_Guide_v3.5.pdf, https://github.com/rouyang2017/SISSO/pull/76]
    primary_task: discover low-dimensional sparse analytical descriptors by feature construction, sure independence screening and sparsifying operators
    task_types: [symbolic regression, descriptor discovery, sparse model selection, multitask learning, classification, held-out prediction]
    inputs: [SISSO.in, train.dat, optional SISSO.out and predict.dat for evaluation]
    outputs: [SISSO.out, Models, SIS_subspaces, predict_X.out, predict_Y.out]
    normal_markers: [SISSO done successfully, Have a nice day, Prediction RMSE and MaxAE]
    convergence_notes: A completed model is not evidence of stability. Converge feature complexity and SIS-subspace size, preserve a leakage-free split, test alternative splits or folds, and report held-out error and equation stability.
    resource_notes: Feature spaces can grow combinatorially. CPU processes must not exceed the requested budget and memory must be assessed against operator set, complexity, features, samples and SIS size. The wrapper sets only the stack limit.
    known_errors:
      - [mpiifort not found or gfortran MPI interface errors, SISSO 3.5 requires its pinned Intel toolchain build, restore the complete toolchain cache and do not rebuild with an unvalidated compiler]
      - [bc not found, the official SISSO_predict expression evaluator lacks its runtime dependency, install the declared bc 1.07.1 package]
      - [Cannot read parameter, SISSO.in does not match version 3.5 syntax or the data dimensions, regenerate from the matching template and verify every explicit parameter]
      - [killed or out of memory, the feature space or saved model count exceeds resources, reduce only scientifically justified search bounds or allocate more memory]

  gmx_mmpbsa:
    display_name: gmx_MMPBSA
    installed_version: "1.6.5"
    operational_status: runnable_isolated_runtime
    official_docs: [https://valdes-tresanco-ms.github.io/gmx_MMPBSA/dev/installation/, https://valdes-tresanco-ms.github.io/gmx_MMPBSA/dev/input_file/, https://valdes-tresanco-ms.github.io/gmx_MMPBSA/dev/examples/Protein_ligand/ST/]
    primary_task: calculate MM/GBSA or MM/PBSA end-state binding energies and residue decompositions from GROMACS trajectories
    task_types: [binding free energy, MM GBSA, MM PBSA, per-frame energy analysis, residue decomposition]
    inputs: [mmpbsa.in, complex TPR, index NDX, trajectory XTC, topology TOP and ITP includes]
    outputs: [FINAL_RESULTS_MMPBSA.dat, FINAL_RESULTS_MMPBSA.csv, optional FINAL_DECOMP_MMPBSA.dat and CSV]
    normal_markers: [Calculation completed, Final Results, exit code 0]
    convergence_notes: Completion does not establish scientific convergence; frame selection, trajectory equilibration, solvent model, dielectric constants, entropy treatment, topology consistency, and uncertainty must be justified and tested.
    resource_notes: The fixed runtime uses Python 3.11, AmberTools 23.6, GROMACS 2025.4, and MPI. It must remain isolated from the shared Python 3.12 and AmberTools 26 environment.
    known_errors:
      - [MMPBSA_mods import failed, the command is running outside the isolated environment, rebuild .envs/gmx-mmpbsa and activate its PATH]
      - [AMBERHOME is not defined, AmberTools tools and data cannot be located, set AMBERHOME to the isolated runtime prefix]
      - [OpenMPI refuses to run as root, container root protection is active, preserve the configured OMPI_ALLOW_RUN_AS_ROOT variables or run as a non-root user]
      - [inconsistent topology or atom count, TPR trajectory topology and includes do not describe the same system, regenerate a consistent immutable input set]

  pmx:
    display_name: pmx
    installed_version: "0+untagged.1.g0dd5f0a"
    operational_status: runnable_pinned_development_version
    official_docs: [https://degrootlab.github.io/pmx/, https://github.com/deGrootLab/pmx]
    primary_task: prepare and analyze explicitly defined GROMACS alchemical transformations
    task_types: [protein DNA and RNA mutation, B-state hybrid topology generation, ligand atom mapping, nonequilibrium work analysis]
    inputs: [hydrogen-complete PDB or GRO, GROMACS TOP or ITP, ligand PDB pairs, XVG work files]
    outputs: [hybrid structures, hybrid topologies, atom-pair maps, mapping scores, free-energy estimates]
    normal_markers: [b-states filled, Final results, exit code 0]
    convergence_notes: Successful preparation does not validate sampling or free-energy convergence; mapping quality, state charges, dummy interactions, overlap, hysteresis, and estimator uncertainty require explicit downstream checks.
    resource_notes: Mutation and topology generation are lightweight. RDKit MCS mapping can grow combinatorially and must use an explicit timeout. GMXLIB must resolve to the pinned pmx mutation-force-field data.
    known_errors:
      - [forcefield path not found, GMXLIB does not point to pmx data/mutff, restore the configured runtime environment variable]
      - [RDKit imports failed, RDKit is absent from the pmx Python runtime, install the declared rdkit dependency in the same environment]
      - [empty or poor atom mapping, MCS alignment or chemical filters do not support this ligand pair, inspect mapping.log and revise explicit mapping policies]
      - [upstream behavior changed, an unpinned develop branch was installed, rebuild exact commit 0dd5f0a or validate a deliberate upgrade]

  acpype:
    display_name: ACPYPE
    installed_version: "2023.10.27"
    operational_status: runnable
    official_docs: [https://acpype.readthedocs.io/, https://github.com/alanwilter/acpype]
    primary_task: generate GAFF-family molecular topologies and convert AMBER topology-coordinate pairs to GROMACS
    task_types: [small-molecule parameterization, GAFF and GAFF2 atom typing, AMBER topology generation, AMBER-to-GROMACS conversion]
    inputs: [PDB MOL2 or MDL molecular structure, or matching prmtop and inpcrd files]
    outputs: [AMBER prmtop and inpcrd, GROMACS top itp and gro, optional CNS or CHARMM files]
    normal_markers: [ACPYPE, Total time of execution, exit code 0]
    convergence_notes: ACPYPE completion validates file generation only; selected charges, protonation, tautomer, atom typing, and force-field compatibility must be checked explicitly before simulation.
    resource_notes: Topology conversion is lightweight; AM1-BCC invokes SQM and must receive a realistic explicit walltime. Open Babel is required for PDB/SMILES input and its Python module must match the ACPYPE Python environment.
    known_errors:
      - [Missing OBABEL, Open Babel executable or Python module is absent, install openbabel in the same runtime and verify both obabel and import openbabel]
      - [Antechamber failed, input chemistry or charge spin and typing settings are inconsistent, inspect acpype.log and rerun Antechamber on the staged input]
      - [GROMACS preprocessing fails, generated topology and coordinates are incompatible or unsuitable for the selected simulation settings, validate with gmx grompp before dynamics]

  tdep:
    display_name: TDEP
    installed_version: "25.03 (d38f435)"
    operational_status: runnable
    official_docs: [https://tdep-developers.github.io/tdep/, https://github.com/tdep-developers/tdep/blob/25.03/INSTALL.md]
    primary_task: fit and analyze temperature-dependent effective lattice-dynamical models
    task_types: [effective force-constant fitting, canonical thermal sampling, phonon dispersion, vibrational thermodynamics, thermal transport]
    inputs: [unit-cell POSCAR, supercell POSCAR, packed simulation HDF5, fitted force constants]
    outputs: [effective force constants, thermal configurations, phonon dispersion and HDF5 data]
    normal_markers: [Done in, All done in, exit code 0]
    convergence_notes: Force-constant models require force-residual and cross-validation checks plus cutoff, trajectory-length, and temperature convergence; phonon completion alone does not validate the fitted model.
    resource_notes: The configured build uses MPICH/gfortran at -O0. MPI ranks must remain within cpu_cores and runtime libraries come from kinetics-legacy.
    known_errors:
      - [segmentation fault during tuple construction, compiler optimization incompatibility, rebuild official 25.03 with OPTIMIZATION_LEVEL=-O0]
      - [missing infile.sim.hdf5, packed trajectory data were not staged, provide a matching TDEP simulation HDF5 file]
      - [unstable or imaginary modes, fitted model or reference structure is unstable or unconverged, inspect the trajectory and converge cutoffs sampling and reference structure]

  airss:
    display_name: AIRSS
    installed_version: 0.9.3
    operational_status: runnable
    official_docs: [https://airss-docs.github.io/getting-started/installation/, https://airss-docs.github.io/technical-reference/buildcell-manual/, https://airss-docs.github.io/technical-reference/airss-utilities/]
    primary_task: generate random sensible crystal structures from an explicit buildcell seed
    task_types: [random crystal generation, constrained structure generation, crystal format conversion]
    inputs: [annotated seed.cell, optional structure file for cabal]
    outputs: [candidate .cell files, explicitly converted structure files]
    normal_markers: [Generated by Buildcell, exit code 0]
    convergence_notes: Structure generation has no electronic or structural convergence criterion; every candidate must be relaxed, deduplicated, and ranked in explicit downstream Actions.
    resource_notes: buildcell and cabal are lightweight single-process utilities; large candidate pools should use bounded batches and preserve every seed and generated file.
    known_errors:
      - ["could not build a structure", "the geometric constraints are inconsistent or too restrictive", "review target volume, atom counts, symmetry, minimum separations, and MAXTIME"]
      - ["empty conversion output", "the input format or file content is incompatible with cabal", "select a supported explicit format and validate the source file"]
      - ["libgfortran.so.5 not found", "the AIRSS private runtime library path is missing", "prepend .software_cache/installations/airss/0.9.3/lib to LD_LIBRARY_PATH"]

  abinit:
    display_name: ABINIT
    installed_version: 10.0.3
    operational_status: runnable
    official_docs: [https://docs.abinit.org/guide/abinit/, https://docs.abinit.org/tutorial/]
    primary_task: periodic ground-state total-energy calculation
    task_types: [ground-state SCF, geometry optimization, band structure, density of states, DFPT]
    inputs: [run.abi, one pseudopotential per element]
    outputs: [run.abo, run.o_WFK, run.o_DEN, stdout.log, stderr.log]
    normal_markers: [Calculation completed, delivered 0]
    convergence_notes: Confirm the SCF residual or energy tolerance for every dataset; process completion alone is insufficient.
    resource_notes: MPI ranks and OpenMP threads must fit cpu_cores; memory is mostly distributed by k points, bands, and FFT grids.
    known_errors:
      - ["parser error or unknown variable", "input variable spelling or version mismatch", "check the 10.0 input-variable reference and keep lines below 132 characters"]
      - ["cannot open pseudopotential", "pseudos or pp_dirpath does not match staged names", "stage every pseudopotential and use job-local paths"]
      - ["SCF cycle reaches nstep", "electronic convergence is not achieved", "review ecut, k mesh, occupations, diemac, tolerances, and nstep"]

  aiida:
    display_name: AiiDA
    installed_version: 2.8.0
    operational_status: runnable_local_without_daemon
    official_docs: [https://aiida.readthedocs.io/projects/aiida-core/en/stable/reference/command_line.html, https://aiida.readthedocs.io/projects/aiida-core/en/stable/howto/run_codes.html]
    primary_task: provenance-tracked workflow orchestration through a configured AiiDA profile
    task_types: [profile inspection, code registration, process submission, process monitoring, archive export]
    inputs: [configured AiiDA profile, database, workflow script, optional broker for daemon submission]
    outputs: [AiiDA database nodes, process records, repository objects, optional archive.aiida]
    normal_markers: [Finished, Excepted count 0]
    convergence_notes: AiiDA process completion describes workflow state; each wrapped scientific code still requires its own convergence checks.
    resource_notes: Synchronous run() works with the local SQLite profile. RabbitMQ and the daemon are only needed for asynchronous submit/play/pause/kill and are deliberately outside the bounded local runtime.
    known_errors:
      - ["No profile loaded", "the isolated job has no configured AiiDA profile", "stage or select a valid profile; do not create production profiles inside an evaluation task"]
      - ["daemon is not running", "broker-backed workflows require the AiiDA daemon", "use direct run for a bounded smoke or configure the daemon outside the job"]
      - ["code or computer not found", "database identifiers are profile-local", "inspect verdi code list and verdi computer list in the selected profile"]

  amber_pmemd:
    display_name: Amber PMEMD
    installed_version: "26"
    operational_status: runnable_serial_and_mpi
    official_docs: [https://ambermd.org/Manuals.php, https://ambermd.org/tutorials/]
    primary_task: classical molecular dynamics or minimization from prepared Amber topology and restart files
    task_types: [energy minimization, heating, NVT dynamics, NPT dynamics, restart continuation]
    inputs: [mdin, topology.prmtop, input.rst7]
    outputs: [mdout, output.rst7, trajectory.nc, mdinfo]
    normal_markers: [Final Performance Info, 5.  TIMINGS]
    convergence_notes: Minimization requires the requested gradient or cycle criterion; MD requires the intended number of steps and stable thermodynamic diagnostics.
    resource_notes: Serial pmemd uses one core; the configured PMEMD OpenMPI launcher is used for pmemd.MPI. Both public serial and MPI paths passed real tests; CUDA PMEMD is not built.
    known_errors:
      - ["Could not open topology or coordinate file", "staged filename differs from -p or -c", "stage exact job-local names and keep all argv paths relative"]
      - ["periodic box or atom count mismatch", "prmtop and rst7 were produced for different systems", "regenerate or pair matching topology and restart files"]
      - ["PMEMD terminated abnormally", "inspect the first preceding ERROR line", "correct input physics or staging before increasing resources"]

  arkane:
    display_name: Arkane
    installed_version: RMG environment
    operational_status: runnable_with_quantum_outputs
    official_docs: [https://reactionmechanismgenerator.github.io/RMG-Py/users/arkane/index.html, https://reactionmechanismgenerator.github.io/RMG-Py/reference/arkane/index.html]
    primary_task: statistical mechanics and pressure-dependent kinetics from validated quantum-chemistry results
    task_types: [thermochemistry, transition-state theory, rotor treatment, pressure dependence, sensitivity analysis]
    inputs: [input.py, species files, transition-state files, quantum-chemistry logs]
    outputs: [output.py, chem.inp, supporting_information.csv, plots]
    normal_markers: [Arkane execution terminated, execution terminated]
    convergence_notes: Arkane success does not validate the upstream electronic structure; verify frequencies, imaginary modes, symmetry, rotor scans, and energy levels first.
    resource_notes: Arkane is usually single-process Python; most cost comes from parsing and master-equation calculations, while quantum calculations must be separate native jobs.
    known_errors:
      - ["could not load species or log file", "a Python input path was not staged", "stage the complete dependency tree with matching relative names"]
      - ["invalid frequency or no imaginary frequency", "upstream stationary point is unsuitable", "recompute and validate the geometry and Hessian"]
      - ["energy units or level-of-theory mismatch", "input objects mix incompatible sources", "declare consistent units and model chemistry explicitly"]

  automekin:
    display_name: AutoMeKin
    installed_version: AutoMeKin2021 revision 1142
    operational_status: workflow_with_components
    official_docs: [https://rxnkin.usc.es/index.php/automekin/, https://github.com/emartineznunez/AutoMeKin]
    primary_task: automated reaction discovery using configured electronic-structure components
    task_types: [trajectory sampling, transition-state search, reaction-network construction, MOPAC component jobs]
    inputs: [AutoMeKin control file, starting structure, method-specific resources]
    outputs: [reaction network, transition-state structures, product structures, component logs]
    normal_markers: [normal termination, ended normally]
    convergence_notes: The workflow must finish and every retained stationary point must have the expected frequency character and connectivity.
    resource_notes: amk.sh orchestrates many child calculations; CPU, memory, walltime, and child executable availability must be budgeted for the complete process group.
    known_errors:
      - ["component executable not found", "MOPAC or another configured backend is absent from PATH", "use the configured runtime and inspect all component paths before submission"]
      - ["trajectory or TS stage stops immediately", "control keywords or starting geometry are invalid", "validate the smallest workflow stage before a full search"]
      - ["background children survive", "workflow spawned processes after the parent exited", "inspect Supervisor cleanup and treat the workflow as failed until children are collected"]

  censo:
    display_name: CENSO
    installed_version: 2.1.2
    operational_status: runnable_with_external_qm
    official_docs: [https://xtb-docs.readthedocs.io/en/latest/CENSO_docs/censo.html, https://github.com/grimme-lab/CENSO]
    primary_task: multilevel energetic refinement of a CREST conformer ensemble
    task_types: [prescreening, DFT ranking, thermostatistics, conformer sorting]
    inputs: [conformers.xyz, .censorc or explicit configuration, selected QM executable]
    outputs: [anmr_enso, crest_conformers.xyz, censo logs, ranked ensemble]
    normal_markers: [CENSO all done, finished]
    convergence_notes: Confirm every requested part completed and that failed conformers were not silently removed from the scientific population.
    resource_notes: CENSO dispatches external QM calculations; internal parallel settings and external-program threads must fit the job allocation.
    known_errors:
      - ["QM executable not found", "the selected ORCA path is unavailable", "use the configured ORCA backend and verify it before the ensemble run"]
      - ["no conformers read", "XYZ ensemble formatting or atom counts are inconsistent", "validate every XYZ block and energy comment"]
      - ["all structures failed", "method, charge, spin, solvent, or resources are unsuitable", "run one conformer directly and repair that failure first"]

  charmm:
    display_name: CHARMM
    installed_version: c50b2
    operational_status: runnable
    official_docs: [https://academiccharmm.org/documentation, https://www.charmm-gui.org/charmmdoc/]
    primary_task: classical molecular mechanics and dynamics from CHARMM topology, parameters, and coordinates
    task_types: [energy evaluation, minimization, molecular dynamics, normal modes, analysis]
    inputs: [input.inp, topology files, parameter files, coordinates]
    outputs: [output.out, restart files, trajectories, analysis tables]
    normal_markers: [NORMAL TERMINATION BY NORMAL STOP, NORMAL STOP]
    convergence_notes: For minimization inspect gradient and step convergence; for dynamics verify completed steps and stable energies, temperature, and pressure.
    resource_notes: Thread or MPI settings are build-specific. Keep CHARMM process count and any domain decomposition within cpu_cores and total memory.
    known_errors:
      - ["CHARMM terminates due to BOMLEV", "a preceding warning or error exceeded the configured tolerance", "repair the first substantive input or topology error instead of lowering BOMLEV"]
      - ["residue or atom type not found", "topology and coordinate naming are inconsistent", "use matching RTF/PRM files and inspect generated segments"]
      - ["cannot open read unit", "a file referenced inside input.inp was not staged", "stage it under the exact unit filename or job-local path"]

  cp2k:
    display_name: CP2K
    installed_version: "2026.1"
    operational_status: runnable
    official_docs: [https://manual.cp2k.org/trunk/, https://www.cp2k.org/howto]
    primary_task: atomistic energy, optimization, or dynamics with Quickstep or force-field methods
    task_types: [single point, geometry optimization, cell optimization, molecular dynamics, vibrational analysis]
    inputs: [input.inp, coordinates, basis sets and potentials when referenced]
    outputs: [output.out, restart files, trajectory files, force files, cube files]
    normal_markers: [PROGRAM ENDED AT, CP2K| Total number of message passing processes]
    convergence_notes: SCF convergence, optimizer convergence, and MD completion are independent; require the marker appropriate to RUN_TYPE.
    resource_notes: Match MPI ranks, OpenMP threads, and CP2K memory-heavy grids to cpu_cores and memory_mb; avoid multiplying both rank and thread counts beyond the allocation.
    known_errors:
      - ["unknown subsection or keyword", "input was authored for another CP2K version or section", "check the 2026.1 input reference and section nesting"]
      - ["basis set or potential not found", "referenced data file was not staged or DATA_DIR is wrong", "stage exact files or use an installed data directory"]
      - ["SCF run NOT converged", "electronic settings are inadequate", "review guess, smearing, mixing, cutoff, EPS_SCF, and MAX_SCF"]

  crest:
    display_name: CREST
    installed_version: 3.0.2
    operational_status: runnable
    official_docs: [https://crest-lab.github.io/crest-docs/, https://github.com/crest-lab/crest]
    primary_task: xTB-driven conformer, protomer, deprotomer, or tautomer enumeration
    task_types: [conformer search, protonation, deprotonation, tautomerization, ensemble screening]
    inputs: [input.xyz]
    outputs: [crest_conformers.xyz, crest.energies, protonated.xyz, deprotonated.xyz, tautomers.xyz]
    normal_markers: [CREST terminated normally]
    convergence_notes: Require the mode-specific final ensemble file in addition to normal termination.
    resource_notes: Set --T no higher than cpu_cores; xTB child processes share the job memory and walltime.
    known_errors:
      - ["binary xtb status not found", "CREST runtime PATH does not expose xTB", "use the configured reaction runtime and verify xTB resolution"]
      - ["conflicting protonation modes", "more than one mutually exclusive mode was selected", "choose exactly one of conformer, protonate, deprotonate, or tautomerize"]
      - ["no conformers generated", "geometry, charge, spin, solvent, or sampling setup failed", "run an xTB single point first and inspect CREST warnings"]

  critic2:
    display_name: Critic2
    installed_version: installed build
    operational_status: runnable_with_field_data
    official_docs: [https://aoterodelaroza.github.io/critic2/manual/, https://github.com/aoterodelaroza/critic2]
    primary_task: topological analysis of an electron-density field
    task_types: [critical-point search, basin integration, noncovalent interaction analysis, crystal-field analysis]
    inputs: [input.cri, structure file, density or wavefunction field]
    outputs: [stdout.log, critical-point tables, basin integrations, optional grids]
    normal_markers: [CRITIC2 ended successfully, critic2]
    convergence_notes: A completed parser run is insufficient; require the requested critical points, basins, or integration results and inspect integration accuracy.
    resource_notes: Most analyses are CPU and memory light relative to the upstream density calculation; large grids can still require substantial memory.
    known_errors:
      - ["unknown command", "input.cri syntax differs from the installed version", "check the installed manual and isolate the failing command"]
      - ["field file cannot be read", "format, units, or staged path is wrong", "convert to a supported format and stage the exact filename"]
      - ["no attractors or basins found", "field resolution or search setup is inadequate", "verify the density grid and search tolerances"]

  deepmd:
    display_name: DeePMD-kit
    installed_version: 3.2.0b0
    operational_status: runnable_pretrained_inference
    official_docs: [https://docs.deepmodeling.com/projects/deepmd/en/master/, https://github.com/deepmodeling/deepmd-kit]
    primary_task: train, freeze, test, or compress a deep potential model
