schema_version: 2

# Dependency runtimes without a registered BackendSpec. They are available only
# through the programmable/native MCP layers and never filter public Actions.
auxiliary_environments:
  automekin:
    conda_name: researchchem-automekin
    environment: .envs/general-modern-openmpi5
    description: AutoMeKin source build with its bundled MOPAC engine and isolated Python/compiler dependencies.
    conda_packages: [python=3.11, numpy, scipy, ase, networkx, matplotlib, parallel, gawk, gxx_linux-64, gfortran_linux-64, make, autoconf, automake, sqlite, bc]
    pip_packages: []
    modules: [numpy, scipy, ase, networkx]
    commands: [amk.sh, mopac, bbfs.exe]
    path_entries: [.software_cache/automekin/install/bin, .software_cache/automekin/install/bin/HLscripts, .software_cache/automekin/install/bin/MOPAC_DEV]
    library_path_entries: [.software_cache/automekin/install/lib, .software_cache/automekin/install/bin/MOPAC_DEV, .envs/general-modern-openmpi5/lib]
    cache_paths: [.software_cache/automekin/source, .software_cache/automekin/install]
    environment_variables:
      AMK: .software_cache/automekin/install
    smoke_commands:
      - [bash, -c, 'cd .software_cache/automekin/smoke && mopac water.mop >/dev/null && grep -q "JOB ENDED NORMALLY" water.out']
    notes: A real water PM7 single-point calculation ended normally. Coupling to other engines remains an explicit Agent decision.

  censo:
    conda_name: researchchem-censo-orca
    environment: .envs/kinetics-legacy
    description: CENSO 2.1.2 conformer-ensemble runtime configured explicitly for ORCA 6.1.1 and xTB.
    conda_packages: [xtb]
    pip_packages: [censo==2.1.2]
    modules: []
    commands: [censo, xtb, orca]
    prepend_path_entries: [.software_cache/orca/6.1.1, .software_cache/openmpi/4.1.8-fortran/bin]
    prepend_library_path_entries: [.software_cache/openmpi/4.1.8-fortran/lib, .software_cache/orca/6.1.1]
    cache_paths: [.software_cache/censo/home/.censo2rc, .software_cache/censo/smoke_prescreen3, .software_cache/orca/6.1.1, .software_cache/openmpi/4.1.8-fortran]
    environment_variables:
      HOME: .software_cache/censo/home
      OPAL_PREFIX: .software_cache/openmpi/4.1.8-fortran
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,vader,tcp
    smoke_commands:
      - [bash, -c, 'grep -q "All jobs executed successfully" .software_cache/censo/smoke_prescreen3/censo.log']
    notes: The repository-local CENSO configuration selects ORCA for all electronic-structure stages. Recreate that configuration after relocation with the documented setup command.

  newtonx:
    conda_name: researchchem-newtonx
    environment: .envs/general-modern-openmpi5
    description: Newton-X New Series 3.5.3 nonadiabatic dynamics and input-generation runtime.
    conda_packages: [python]
    pip_packages: []
    modules: []
    commands: [nx_moldyn, nx_geninp, nx_test]
    prepend_path_entries: [.software_cache/newton-x/26a/package/NX-NS/bin, .software_cache/orca/6.1.1, .software_cache/openmpi/4.1.8-fortran/bin]
    prepend_library_path_entries: [.software_cache/openmpi/4.1.8-fortran/lib, .software_cache/orca/6.1.1]
    library_path_entries: [.software_cache/newton-x/26a/package/NX-NS/lib/x86_64-linux-gnu]
    cache_paths: [.software_cache/newton-x/26a, .software_cache/newton-x/26a/package/CIOVERLAP/bin, .software_cache/orca/6.1.1, .software_cache/openmpi/4.1.8-fortran]
    environment_variables:
      NXHOME: .software_cache/newton-x/26a/package/NX-NS
      NX: .software_cache/newton-x/26a/package
      CIOVERLAP: .software_cache/newton-x/26a/package/CIOVERLAP/bin
      ORCA: .software_cache/orca/6.1.1
      OPAL_PREFIX: .software_cache/openmpi/4.1.8-fortran
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,vader,tcp
    smoke_commands:
      - [bash, -c, 'grep -q "Normal termination of Newton-X" .software_cache/newton-x/26a/smoke/orca_test_cio/orca/01-MD-TDDFT-NAD-CIO/md.log']
    notes: The bundled analytical test and a real 1.5 fs ORCA trajectory passed. Scientific trajectory controls remain explicit native inputs.

  pyfrag:
    conda_name: researchchem-pyfrag-orca
    environment: .envs/kinetics-legacy
    description: Pinned PyFrag 2019.02 activation-strain runtime using a separately obtained ORCA 6.1.1 executable.
    conda_packages: [python=3.11]
    pip_packages: []
    modules: []
    commands: [pyfrag-orca, orca]
    prepend_path_entries: [.software_cache/pyfrag/2019/bin, .software_cache/orca/6.1.1, .software_cache/openmpi/4.1.8-fortran/bin]
    prepend_library_path_entries: [.software_cache/openmpi/4.1.8-fortran/lib]
    cache_paths: [.software_cache/pyfrag/2019, .software_cache/orca/6.1.1, .software_cache/openmpi/4.1.8-fortran]
    environment_variables:
      CHEMGRAPH_PYFRAG_COMMAND: .software_cache/pyfrag/2019/bin/pyfrag-orca
      OPAL_PREFIX: .software_cache/openmpi/4.1.8-fortran
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,vader,tcp
    notes: Apply chemistry_toolbox/patches/pyfrag-v1.0.0-python3-orca6.patch to source commit af2a122d. ORCA has separate registration and redistribution terms.

  theodore:
    conda_name: researchchem-theodore
    environment: .envs/general-modern-openmpi5
    description: TheoDORE 2.5.0 excited-state analysis runtime with cclib.
    conda_packages: [numpy, scipy, matplotlib, cclib]
    pip_packages: [theodore=2.5.0]
    modules: [theodore, cclib]
    commands: [theodore]
    notes: TheoDORE imports and CLI start; optional OpenBabel/Orbkit extensions are non-blocking extras.

  vesta:
    conda_name: researchchem-binary-runtime-vesta
    environment: .envs/general-modern-openmpi5
    description: VESTA 3.90.5a GTK3 x86_64 GUI runtime with locally extracted system libraries.
    conda_packages: []
    pip_packages: []
    modules: []
    commands: [VESTA]
    path_entries: [.software_cache/vesta/3.90.5a]
    library_path_entries: [.software_cache/vesta/3.90.5a, .software_cache/vesta/deps/root/usr/lib/x86_64-linux-gnu]
    cache_paths: [.software_cache/vesta/3.90.5a, .software_cache/vesta/deps]
    smoke_commands:
      - [bash, -c, 'timeout 5s xvfb-run -a VESTA >/dev/null 2>&1; code=$?; [ "$code" -eq 0 ] || [ "$code" -eq 124 ]']
    notes: Dynamic libraries resolve and bounded Xvfb startup passes. Interactive rendering still depends on a host display/OpenGL stack.

  vmd:
    conda_name: researchchem-vmd
    environment: .envs/general-modern-openmpi5
    description: VMD 1.9.3 text-mode molecular visualization and trajectory parser.
    conda_packages: [vmd=1.9.3]
    pip_packages: []
    modules: []
    commands: [vmd]
    smoke_commands:
      - [vmd, -dispdev, text, -e, /dev/null]
    notes: Text-mode startup passes without an X display; GUI rendering remains host/display dependent.
