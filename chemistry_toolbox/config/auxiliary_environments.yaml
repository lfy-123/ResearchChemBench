# Dependency runtimes that do not filter or own predefined Action tools.
# Installed modules and reviewed commands can be selected explicitly through
# the programmable/native MCP layers; no workflow or scientific parameter is
# inferred from an auxiliary environment.
auxiliary_environments:
  workflows:
    conda_name: researchchem-workflows
    environment: .tool_envs/workflows
    description: QCSchema/QCElemental/QCEngine, AiiDA, atomate2, jobflow and workflow data libraries.
    conda_packages: [aiida-core=2.8.0, atomate2=0.1.5, jobflow=0.3.1, qcelemental, qcengine, cclib, pymatgen, spglib, mdtraj]
    pip_packages: []
    modules: [aiida, atomate2, jobflow, qcelemental, qcengine, cclib, pymatgen, spglib, mdtraj]
    commands: [verdi]
    cache_paths: [.software_cache/aiida]
    environment_variables:
      AIIDA_PATH: .software_cache/aiida
    smoke_commands:
      - [verdi, status]
    notes: SQLite AiiDA profile researchchembench is initialized; RabbitMQ/daemon is optional and not started.

  nwchem:
    conda_name: researchchem-nwchem
    environment: .tool_envs/nwchem
    description: NWChem 7.3.1 executable plus QCEngine/QCSchema bridge and parser libraries.
    conda_packages: [nwchem=7.3.1, qcengine, qcelemental, cclib, geometric, ase]
    pip_packages: [autode=1.4.5]
    modules: [qcelemental, qcengine, cclib, geometric, autode, ase]
    commands: [nwchem, qcengine]
    cache_paths: [.software_cache/nwchem/source/src/basis/libraries]
    environment_variables:
      NWCHEM_BASIS_LIBRARY: .software_cache/nwchem/source/src/basis/libraries
    notes: The official NWChem basis-library tree is kept in .software_cache; QCEngine HF/STO-3G water smoke passed.

  gpaw:
    conda_name: researchchem-gpaw
    environment: .tool_envs/gpaw
    description: GPAW 25.7.0 CPU runtime with PAW setup data.
    conda_packages: [gpaw=25.7.0, ase]
    pip_packages: []
    modules: [gpaw, ase]
    commands: [gpaw]
    cache_paths: [.software_cache/gpaw/setups]
    environment_variables:
      GPAW_SETUP_PATH: .software_cache/gpaw/setups
    smoke_commands:
      - [gpaw, info]
    notes: H2 PBE/PW200 energy smoke passed; no GPU is assumed.

  free_energy:
    conda_name: researchchem-free-energy
    environment: .tool_envs/free_energy
    description: HOOMD-blue, PyMBAR and alchemlyb analysis runtime.
    conda_packages: [hoomd=7.1.0, pymbar=4.2.0, alchemlyb=2.5.0, mdtraj]
    pip_packages: []
    modules: [hoomd, pymbar, alchemlyb, mdtraj]
    commands: []
    notes: CPU HOOMD zero-step and PyMBAR three-state smokes passed; alchemlyb import passed.

  rmg:
    conda_name: researchchem-rmg
    environment: .tool_envs/rmg
    description: RMG-Py 4.0.0 and Arkane package runtime.
    conda_packages: [rmg=4.0.0]
    pip_packages: []
    modules: [rmgpy]
    commands: [rmg.py, Arkane.py]
    cache_paths: [.software_cache/rmg/database/4.0.0/input, .software_cache/rmg/source/4.0.0]
    environment_variables:
      HOME: .software_cache/rmg/home
    notes: RMG-Py 4.0.0 source and database 4.0.0 are cached. The database root is configured through .software_cache/rmg/home/.rmg/rmgrc; Arkane remains separately audited because its import is exceptionally slow in this build.

  kinbot:
    conda_name: researchchem-kinbot
    environment: .tool_envs/kinbot
    description: KinBot 2.2.2 with Sella/JAX and geometry dependencies.
    conda_packages: [numpy=1.26, scipy, ase, networkx, matplotlib, rmsd, openbabel, jax=0.4.35, jaxlib=0.4.35]
    pip_packages: [kinbot=2.2.2, sella=2.5.0]
    modules: [kinbot, sella, jax, openbabel]
    commands: [kinbot, pes]
    notes: Imports and command entry points pass; a production PES run still needs a concrete input and is not run by health audit.

  critic2:
    conda_name: researchchem-source-runtime-critic2
    environment: .tool_envs/deepmd
    description: Critic2 1.2.1081 source build using the shared conda compiler/runtime libraries.
    conda_packages: [gfortran_linux-64, spglib]
    pip_packages: []
    modules: []
    commands: [critic2]
    path_entries: [.software_cache/critic2/install-conda/bin]
    library_path_entries: [.tool_envs/deepmd/lib]
    cache_paths: [.software_cache/critic2/source, .software_cache/critic2/install-conda]
    notes: Official source was compiled with internal LAPACK and OpenMP; interactive startup/end smoke passed.

  shengbte:
    conda_name: researchchem-source-runtime-shengbte
    environment: .tool_envs/deepmd
    description: ShengBTE source build using OpenMPI, spglib, LAPACK and OpenMP.
    conda_packages: [openmpi, spglib, lapack, blas, gfortran_linux-64]
    pip_packages: []
    modules: []
    commands: [ShengBTE]
    path_entries: [.software_cache/shengbte/source]
    library_path_entries: [.tool_envs/deepmd/lib]
    cache_paths: [.software_cache/shengbte/source]
    notes: Official Bitbucket master was compiled; the supplied Test-RTA completed normally and produced conductivity/heat-capacity outputs.

  openmolcas:
    conda_name: researchchem-source-runtime-openmolcas
    environment: .tool_envs/deepmd
    description: OpenMolcas v25.10 serial/OpenMP source build with the pymolcas driver.
    conda_packages: [gfortran_linux-64, pyparsing]
    pip_packages: []
    modules: []
    commands: [pymolcas]
    path_entries: [.software_cache/openmolcas/25.10, .software_cache/openmolcas/25.10/bin]
    library_path_entries: [.software_cache/openmolcas/25.10/lib, .tool_envs/deepmd/lib]
    cache_paths: [.software_cache/openmolcas/source, .software_cache/openmolcas/25.10]
    environment_variables:
      MOLCAS: .software_cache/openmolcas/25.10
    notes: v25.10 was compiled with internal BLAS/LAPACK, built-in Libxc and OpenMP; a real H2 STO-3G SCF returned -1.1167593075 hartree and Happy landing.

  sharc:
    conda_name: researchchem-source-runtime-sharc
    environment: .tool_envs/deepmd
    description: SHARC4 core source build plus the ASCII wfoverlap executable.
    conda_packages: [gfortran_linux-64, lapack, blas, fftw]
    pip_packages: []
    modules: []
    commands: [sharc.x, wfoverlap.x]
    path_entries: [.software_cache/sharc/source/bin]
    library_path_entries: [.tool_envs/deepmd/lib]
    cache_paths: [.software_cache/sharc/source]
    notes: Core SHARC4 and wfoverlap_ascii were compiled; PySHARC/NetCDF and external electronic-structure interfaces remain optional and input-dependent.

  multiwfn:
    conda_name: researchchem-binary-runtime-multiwfn
    environment: .tool_envs/multiwfn
    description: Official Multiwfn 2026.7.15 Linux noGUI wavefunction-analysis runtime.
    conda_packages: []
    pip_packages: []
    modules: []
    commands: [Multiwfn_noGUI]
    path_entries: [.software_cache/multiwfn/2026.7.15/Multiwfn_2026.7.15_bin_Linux_noGUI]
    cache_paths: [.software_cache/multiwfn/2026.7.15]
    environment_variables:
      OMP_STACKSIZE: 2G
    smoke_commands:
      - [bash, -c, 'cd .software_cache/multiwfn/2026.7.15/Multiwfn_2026.7.15_bin_Linux_noGUI && printf "q\n" | ./Multiwfn_noGUI examples/H2.fch >/dev/null']
    notes: The bundled H2.fch example loads and exits normally; GUI-only analysis is unavailable in this noGUI package and required citations remain mandatory.

  mess:
    conda_name: researchchem-source-runtime-mess
    environment: .tool_envs/mess
    description: MESS 2020.1.24 master-equation solver built with SLATEC, OpenBLAS/LAPACK and OpenMP.
    conda_packages: []
    pip_packages: []
    modules: []
    commands: [mess]
    path_entries: [.software_cache/mess/2020.1.24/build]
    library_path_entries: [.tool_envs/deepmd/lib]
    cache_paths: [.software_cache/mess/2020.1.24]
    environment_variables:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    smoke_commands:
      - [bash, -c, 'cd .software_cache/mess/smoke/hco && ../../2020.1.24/build/mess hco.inp >/dev/null']
    notes: A real bundled HCO calculation completed across seven temperatures and three finite pressures plus the high-pressure limit.

  mesmer:
    conda_name: researchchem-source-runtime-mesmer
    environment: .tool_envs/mesmer
    description: MESMER 7.1 command-line master-equation and energy-transfer solver.
    conda_packages: []
    pip_packages: []
    modules: []
    commands: [mesmer]
    path_entries: [.software_cache/mesmer/7.1/bin]
    cache_paths: [.software_cache/mesmer/7.1]
    smoke_commands:
      - [bash, -c, 'cd .software_cache/mesmer/smoke/examples/H2Ominimal && ../../../7.1/bin/mesmer H2Ominimal.xml -oH2Ominimal.audit.xml >/dev/null']
    notes: Official SourceForge 7.1 source was compiled; the bundled minimal H2O example produces pressure-dependent rate output.

  automekin:
    conda_name: researchchem-automekin
    environment: .tool_envs/automekin
    description: AutoMeKin source build with its bundled MOPAC engine and isolated Python/compiler dependencies.
    conda_packages: [python=3.11, numpy, scipy, ase, networkx, matplotlib, parallel, gawk, gxx_linux-64, gfortran_linux-64, make, autoconf, automake, sqlite, bc]
    pip_packages: []
    modules: [numpy, scipy, ase, networkx]
    commands: [amk.sh, mopac, bbfs.exe]
    path_entries: [.software_cache/automekin/install/bin, .software_cache/automekin/install/bin/HLscripts, .software_cache/automekin/install/bin/MOPAC_DEV]
    library_path_entries: [.software_cache/automekin/install/lib, .software_cache/automekin/install/bin/MOPAC_DEV, .tool_envs/automekin/lib]
    cache_paths: [.software_cache/automekin/source, .software_cache/automekin/install]
    environment_variables:
      AMK: .software_cache/automekin/install
    smoke_commands:
      - [bash, -c, 'cd .software_cache/automekin/smoke && mopac water.mop >/dev/null && grep -q "JOB ENDED NORMALLY" water.out']
    notes: A real water PM7 single-point calculation ended normally. Gaussian is now configured as an independent atomic backend, but AutoMeKin-to-Gaussian/Qcore coupling is intentionally not prewired because the Agent must select and compose engines explicitly.

  matlab:
    conda_name: researchchem-matlab-r2018a-licensed
    environment: .software_cache/matlab/R2018a/install
    description: Licensed MATLAB R2018a host runtime; official offline media are staged but installation remains license-gated.
    conda_packages: []
    pip_packages: []
    modules: []
    commands: [matlab]
    path_entries: [.software_cache/matlab/R2018a/install/bin]
    cache_paths: [.software_cache/matlab/R2018a/installation_media/R2018a_glnxa64_dvd1.iso, .software_cache/matlab/R2018a/installation_media/R2018a_glnxa64_dvd2.iso]
    notes: The crack archive present in the manual download folder is excluded. Supply a legitimate MathWorks File Installation Key and license file/server before installing into the declared install directory.

  easyspin:
    conda_name: researchchem-easyspin-staged
    environment: .software_cache/easyspin/6.0.12
    description: EasySpin 6.0.12 MATLAB toolbox staged from the operator-provided archive.
    conda_packages: []
    pip_packages: []
    modules: []
    commands: [matlab]
    path_entries: [.software_cache/matlab/R2018a/install/bin, .software_cache/easyspin/6.0.12/easyspin]
    cache_paths: [.software_cache/easyspin/6.0.12/easyspin]
    notes: Toolbox files including easyspin.m, pepper.m and chili.m are present. MATLAB R2018a media are staged, but no licensed matlab command exists yet, so executable validation and public atomic spectral adapters remain pending.

  vesta:
    conda_name: researchchem-binary-runtime-vesta
    environment: .tool_envs/vesta
    description: VESTA 3.90.5a GTK3 x86_64 GUI runtime with locally extracted system libraries.
    conda_packages: []
    pip_packages: []
    modules: []
    commands: [VESTA]
    path_entries: [.software_cache/vesta/3.90.5a]
    library_path_entries: [.software_cache/vesta/3.90.5a, .software_cache/vesta/deps/root/usr/lib/x86_64-linux-gnu]
    cache_paths: [.software_cache/vesta/3.90.5a, .software_cache/vesta/deps]
    smoke_commands:
      - [bash, -c, 'timeout 5s xvfb-run -a VESTA >/dev/null 2>&1; code=$?; [ "$code" -eq 0 ] || [ "$code" -eq 124 ]']
    notes: All dynamic libraries resolve and Xvfb headless startup remains healthy for the bounded smoke; interactive use still requires a suitable display/OpenGL stack.

  yambo:
    conda_name: researchchem-yambo
    environment: .tool_envs/yambo
    description: Yambo 5.3.0 single-process executable and p2y interface.
    conda_packages: [yambo=5.3.0]
    pip_packages: []
    modules: []
    commands: [yambo, p2y]
    notes: Versioned binary is installed; a real GW/BSE calculation still needs an Agent-selected input database and upstream wavefunction files.

  vmd:
    conda_name: researchchem-vmd
    environment: .tool_envs/vmd
    description: VMD 1.9.3 text-mode molecular visualization/trajectory parser.
    conda_packages: [vmd=1.9.3]
    pip_packages: []
    modules: []
    commands: [vmd]
    smoke_commands:
      - [vmd, -dispdev, text, -e, /dev/null]
    notes: Text-mode startup passes without an X display; GUI rendering remains host/display dependent.

  lobster:
    conda_name: researchchem-lobster
    environment: .tool_envs/lobster
    description: Licensed LOBSTER 5.1.0 periodic bonding-analysis executable with pymatgen support.
    conda_packages: [pymatgen]
    pip_packages: []
    modules: [pymatgen]
    commands: [lobster-5.1.0]
    path_entries: [.software_cache/lobster/5.1.0/package]
    cache_paths: [.software_cache/lobster/5.1.0]
    smoke_commands:
      - [bash, -c, 'grep -q "finished in" .software_cache/lobster/5.1.0/smoke/qe_diamond/lobsterout && grep -q "abs. charge spilling" .software_cache/lobster/5.1.0/smoke/qe_diamond/lobsterout']
    notes: A real Quantum ESPRESSO-to-LOBSTER diamond calculation completed with 1.12% absolute charge spilling. It remains runtime-only because the current public catalog has no typed periodic bonding-analysis Action; no arbitrary lobsterin runner was added.

  newtonx:
    conda_name: researchchem-newtonx
    environment: .tool_envs/newtonx
    description: Newton-X New Series 3.5.3 nonadiabatic dynamics and input-generation runtime.
    conda_packages: [python]
    pip_packages: []
    modules: []
    commands: [nx_moldyn, nx_geninp, nx_test]
    path_entries: [.software_cache/newton-x/26a/package/NX-NS/bin]
    library_path_entries: [.software_cache/newton-x/26a/package/NX-NS/lib/x86_64-linux-gnu]
    cache_paths: [.software_cache/newton-x/26a]
    environment_variables:
      NXHOME: .software_cache/newton-x/26a/package/NX-NS
    smoke_commands:
      - [bash, -c, 'grep -q "SUMMARY: 1 / 1 tests passed" .software_cache/newton-x/26a/smoke/nx_test_1.log && grep -q "Normal termination of testsuite" .software_cache/newton-x/26a/smoke/nx_test_1.log']
    notes: The bundled 1D analytical avoided-crossing test passed. It remains runtime-only because a nonadiabatic trajectory requires a new typed action contract spanning states, couplings, hopping controls and an explicitly selected electronic-structure interface; no monolithic nx_moldyn runner was exposed.

  theodore:
    conda_name: researchchem-theodore
    environment: .tool_envs/theodore
    description: TheoDORE 2.5.0 excited-state analysis runtime with cclib.
    conda_packages: [numpy, scipy, matplotlib, cclib]
    pip_packages: [theodore=2.5.0]
    modules: [theodore, cclib]
    commands: [theodore]
    notes: TheoDORE imports and CLI start; optional OpenBabel/Orbkit extensions are not present and are recorded as non-blocking limitations.
