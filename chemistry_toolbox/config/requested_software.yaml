# Requested software inventory
# status_policy:
#   specification = a data model/specification rather than an installable program
#   probe = inspect the declared runtime modules/commands
#   manual = requires operator download, source build, registration, or license
#   interface = no stable supported API is declared; do not implement brittle scraping
requested_software:
  - name: QCSchema
    category: Data and Workflow Infrastructure
    kind: specification
    status_policy: specification
    environment: workflows
    modules: []
    commands: []
    license: specification
    public_adapter: existing
    role: Standard JSON/schema contract shared by QCElemental and QCEngine.
    notes: Not a standalone executable; exposed through normalize_qcschema_molecule and validate_qcschema_record using QCElemental models rather than a fake software runner.
    official_url: https://molssi.github.io/QCElemental/

  - name: QCElemental
    category: Data and Workflow Infrastructure
    kind: python_library
    status_policy: probe
    environment: workflows
    modules: [qcelemental]
    commands: []
    license: BSD-3-Clause
    public_adapter: existing
    role: Periodic-table data and QCSchema Pydantic models.
    notes: Installed in the workflows runtime and exposed through typed QCSchema normalization/validation actions; it is also used by QCEngine.
    official_url: https://molssi.github.io/QCElemental/

  - name: QCEngine
    category: Data and Workflow Infrastructure
    kind: python_library
    status_policy: probe
    environment: workflows
    modules: [qcengine]
    commands: [qcengine]
    license: BSD-3-Clause
    public_adapter: runtime_only
    role: QCSchema executor and program harness.
    notes: Execution substrate rather than a separate scientific result; NWChem public actions use its exact QCSchema harness, but no generic QCEngine workflow runner is exposed.
    official_url: https://molssi.github.io/QCEngine/

  - name: cclib
    category: Data and Workflow Infrastructure
    kind: python_library
    status_policy: probe
    environment: workflows
    modules: [cclib]
    commands: []
    license: LGPL-3.0
    public_adapter: existing
    role: Parser for quantum-chemistry output files.
    notes: Exposed as parse_quantum_chemistry_output for bounded parsing of Agent-supplied quantum-chemistry outputs; also installed in the TheoDORE runtime.
    official_url: https://cclib.github.io/

  - name: pymatgen
    category: Data and Workflow Infrastructure
    kind: python_library
    status_policy: probe
    environment: workflows
    modules: [pymatgen]
    commands: []
    license: MIT
    public_adapter: existing
    role: Materials structures, symmetry, and file-format data model.
    notes: Exposed for crystal symmetry analysis, standardization, supercell construction, and explicit surface-slab enumeration.
    official_url: https://pymatgen.org/

  - name: spglib
