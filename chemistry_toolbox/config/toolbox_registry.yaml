schema_version: 3
catalog_kind: dynamic_backend_catalog
source_module: researchchem_toolbox.specs
source_symbol: BACKEND_SPECS
health_source: researchchem_toolbox.runtime.probe_all_backends
public_action_source: researchchem_toolbox.specs.ACTION_SPECS
exposure_policy: progressive_discovery
catalog_visibility_policy: complete_task_independent
full_catalog_compatibility_mode: true
backend_selection_policy: agent_required
automatic_fallback: false
notes:
  - This manifest deliberately contains no task-specific tool list or backend ranking.
  - Progressive discovery changes schema delivery only; every catalog entry remains discoverable.
  - Use `python -m chemistry_toolbox.mcp.tool_manager snapshot` for a full JSON snapshot.
  - Use `python -m chemistry_toolbox.mcp.tool_manager missing` for live install status.
