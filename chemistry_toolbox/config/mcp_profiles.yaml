    backends: [openff_am1bcc, openff]

  mlip:
    conda_name: researchchem-mlip
    server_name: researchchem_mlip
    description: Machine-learning interatomic potentials and model-isolated runtimes.
    environment: .envs/general-modern-openmpi5
    runtime_preload_libraries: [libstdc++.so.6, libgcc_s.so.1]
    conda_packages: [ase]
    # MACE and CHGNet remain isolated here. NequIP/Allegro and DeePMD use their
    # own public runtimes because their checkpoint formats and dependencies differ.
    pip_packages: [mace-torch==0.3.16, chgnet]
    use_project_model_cache: true
    health_checks:
      modules: [ase, chgnet, mace, mace.calculators, torch]
      models:
        mace_medium_mpa_0:
          backend: mace_mp
          model: medium-mpa-0
          device: cpu
          default_dtype: float64
    backends: [mace, chgnet]

  nequip:
    conda_name: researchchem-nequip
