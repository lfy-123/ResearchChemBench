    health_checks:
      modules: [catmap, ase]
      commands: [catmap]
      allowed_dependency_issue_patterns:
        - '^ase 3\.17\.0 is not supported on this platform$'
    command_variables:
      CHEMGRAPH_CATMAP_COMMAND: catmap
    backends: [catmap]

  qe:
    conda_name: researchchem-qe
    server_name: researchchem_qe
