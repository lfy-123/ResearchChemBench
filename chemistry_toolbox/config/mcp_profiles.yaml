      CHEMGRAPH_VASPKIT_COMMAND: .software_cache/installations/vaspkit/1.5.1/vaspkit.1.5.1/bin/vaspkit
      CHEMGRAPH_VASPKIT_CONFIG: .software_cache/state/vaspkit/1.5.1/home/.vaspkit
    path_entries: [.software_cache/installations/vaspkit/1.5.1/vaspkit.1.5.1/bin]
    cache_paths: [.software_cache/installations/vaspkit/1.5.1]
    smoke_commands:
      - [bash, -c, '.software_cache/installations/vaspkit/1.5.1/vaspkit.1.5.1/bin/vaspkit -help 2>&1 | grep -q "VASPKIT Standard Edition 1.5.1"']
      - [bash, -c, 'test -s .software_cache/validation/vaspkit/1.5.1/smoke/kmesh/KPOINTS']
      - [bash, -c, 'test -s .software_cache/validation/vaspkit/1.5.1/smoke/bandgap/EIGENVAL']
    backends: [vaspkit]

  bagel:
    conda_name: researchchem-bagel
    description: Self-contained BAGEL 1.2.2 MPICH runtime for explicit multireference energies, gradients, and nonadiabatic couplings.
    environment: .envs/general-modern-openmpi5
    conda_packages: [python=3.11, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [pydantic, yaml]
      commands: [BAGEL, bagel-mpirun]
      external_commands:
        - .software_cache/installations/bagel/1.2.2/bin/BAGEL
        - .software_cache/installations/bagel/1.2.2/bin/bagel-mpirun
        - .software_cache/installations/bagel/1.2.2/runtime/usr/bin/BAGEL
        - .software_cache/installations/bagel/1.2.2/runtime/usr/bin/mpiexec.hydra
    command_variables:
      CHEMGRAPH_BAGEL_COMMAND: .software_cache/installations/bagel/1.2.2/bin/BAGEL
      CHEMGRAPH_BAGEL_MPIRUN_COMMAND: .software_cache/installations/bagel/1.2.2/bin/bagel-mpirun
      CHEMGRAPH_BAGEL_RAW_COMMAND: .software_cache/installations/bagel/1.2.2/runtime/usr/bin/BAGEL
      CHEMGRAPH_BAGEL_BASIS_DIRECTORY: .software_cache/installations/bagel/1.2.2/runtime/usr/share/bagel
    path_entries: [.software_cache/installations/bagel/1.2.2/bin]
    cache_paths: [.software_cache/installations/bagel/1.2.2]
    smoke_commands:
      - [bash, -c, 'grep -q "METHOD: FCI" .software_cache/validation/bagel/1.2.2/smoke/hf-fci/output.out']
      - [bash, -c, 'grep -q "METHOD: NACME" .software_cache/validation/bagel/1.2.2/smoke/casscf-nac/output.out']
      - [bash, -c, 'grep -q "CASPT2 energy" .software_cache/validation/bagel/1.2.2/smoke/caspt2-gradient/output.out']
      - [bash, -c, 'grep -q "using 1 threads per process" .software_cache/validation/bagel/1.2.2/smoke/hf-fci/output-mpi2.out']
    backends: [bagel]

  md:
    conda_name: researchchem-md
    description: Molecular dynamics preparation, execution, enhanced sampling, and analysis.
    environment: .envs/molecular-simulation-openff
    conda_packages: [openmm, pdbfixer, gromacs, plumed, netcdf4, packmol, parmed]
    pip_packages: [MDAnalysis]
    health_checks:
      modules: [MDAnalysis, openmm, pdbfixer]
      commands: [gmx, packmol, plumed]
      allowed_dependency_issue_patterns:
        - '^acpype 2023\.10\.27 requires openbabel-wheel, which is not installed\.$'
    command_variables:
      CHEMGRAPH_GROMACS_COMMAND: gmx
      CHEMGRAPH_PLUMED_COMMAND: plumed
    prepend_path_entries:
      # AmberTools 26 intentionally conflicts with the standalone Packmol
      # Conda package. Packmol is shared from the consolidated general prefix.
      - .envs/general-modern-openmpi5/bin
    backends:
      - pdbfixer
      - openmm_builder
      - packmol
      - openmm
      - gromacs
      - mdanalysis
      - plumed

  openff:
    conda_name: researchchem-openff
    description: Isolated modern OpenFF Toolkit, Interchange, and AmberTools runtime.
    environment: .envs/molecular-simulation-openff
    python_version: "3.12"
    conda_packages:
      - openff-toolkit
      - openff-interchange
      - ambertools
      - "numpy<2"
      - "biopython<1.86"
      - netcdf4
      - pdb2pqr
      - requests
      - "docutils<0.18"
    pip_packages: []
    health_checks:
      modules: [openff.interchange, openff.toolkit]
      commands: [antechamber, sqm]
      allowed_dependency_issue_patterns:
        - '^acpype 2023\.10\.27 requires openbabel-wheel, which is not installed\.$'
    backends: [openff_am1bcc, openff]

  mlip:
    conda_name: researchchem-mlip
    description: Machine-learning interatomic potentials and model-isolated runtimes.
    environment: .envs/general-modern-openmpi5
    runtime_preload_libraries: [libstdc++.so.6, libgcc_s.so.1]
    conda_packages: [ase]
    # MACE and CHGNet remain isolated here. NequIP/Allegro and DeePMD use their
    # own public runtimes because their checkpoint formats and dependencies differ.
    pip_packages: [mace-torch==0.3.16, chgnet]
    use_project_model_cache: true
    health_checks:
      modules: [ase, chgnet, mace, mace.calculators, torch]
      models:
        mace_medium_mpa_0:
          backend: mace_mp
          model: medium-mpa-0
          device: cpu
          default_dtype: float64
    backends: [mace, chgnet]

  nequip:
    conda_name: researchchem-nequip
    description: NequIP 0.19.0 and Allegro 0.8.3 inference runtime with explicitly registered local checkpoints.
    environment: .envs/equivariant-ml
    runtime_preload_libraries: [libstdc++.so.6, libgcc_s.so.1]
    conda_packages: [nequip=0.19.0, ase, pydantic, pyyaml, python-dotenv]
    pip_packages: [nequip-allegro==0.8.3]
    use_project_model_cache: true
    health_checks:
      modules: [nequip, allegro, torch, e3nn, ase]
      commands: [nequip-train]
    backends: [nequip, allegro]

  deepmd:
    conda_name: researchchem-deepmd-models
    description: DeePMD-kit 3.2.0b0 CPU inference runtime for the downloaded DPA multitask and OMol checkpoints.
    environment: .envs/equivariant-ml
    runtime_preload_libraries: [libstdc++.so.6, libgcc_s.so.1]
    conda_packages: [python=3.11]
    pip_packages: [deepmd-kit==3.2.0b0, ase==3.29.0, mpich==5.0.1.post1, e3nn==0.6.0, pydantic, pyyaml, python-dotenv]
    use_project_model_cache: true
    health_checks:
      modules: [deepmd, ase, e3nn, torch]
      commands: [dp]
    backends: [deepmd]

  vasp:
    conda_name: researchchem-vasp
    description: Locally compiled VASP 6.3.2 standard executable with OpenMPI and an explicit-POTCAR atomic adapter.
    environment: .envs/general-modern-openmpi5
    conda_packages: [python=3.11, ase, pydantic, pyyaml, python-dotenv, gcc_linux-64, gxx_linux-64, gfortran_linux-64, openmpi, openblas, lapack, scalapack, fftw]
    pip_packages: []
    health_checks:
      modules: [ase]
      commands: [vasp_std, mpirun]
      external_commands: [.software_cache/installations/vasp/6.3.2/bin/vasp_std]
    command_variables:
      CHEMGRAPH_VASP_COMMAND: .software_cache/installations/vasp/6.3.2/bin/vasp_std
      CHEMGRAPH_VASP_MPI_COMMAND: mpirun
    path_entries: [.software_cache/installations/vasp/6.3.2/bin]
    library_path_entries: [.envs/general-modern-openmpi5/lib]
    environment_variables:
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
    backends: [vasp]

  docking:
    conda_name: researchchem-docking
    description: Protein-ligand docking binaries and model-specific docking tools.
    environment: .envs/molecular-simulation-openff
    conda_packages: [vina]
    pip_packages: []
    health_checks:
      modules: [vina]
      commands: [vina]
      external_commands: [.software_cache/installations/gnina/1.3.3/gnina]
      allowed_dependency_issue_patterns:
        - '^acpype 2023\.10\.27 requires openbabel-wheel, which is not installed\.$'
    command_variables:
      CHEMGRAPH_VINA_COMMAND: vina
      CHEMGRAPH_GNINA_COMMAND: .software_cache/installations/gnina/1.3.3/gnina
    path_entries: [.software_cache/installations/gnina/1.3.3]
    backends: [vina, gnina]
