schema_version: 2
default_profiles: [core]
model_cache_root: .model_cache
audit:
  # Every registered BackendSpec is expected to be available in the completed build.
  allowed_unavailable_backends: []
public_server:
  runtime: core
  server_name: researchchem_toolbox
  description: Unified MCP server exposing the complete versioned Scientific/Data Action catalog to every benchmark task.

# Every runtime below points directly to one of the six physical .envs prefixes.

# Executable-only backend runtimes. No runtime owns or filters public tools.
support_environments:
  abinit:
    conda_name: researchchem-abinit
    description: Isolated ABINIT executable used only when the Agent selects backend_id=abinit.
    environment: .envs/kinetics-legacy
    conda_packages: [abinit, typing_extensions, numpy, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [numpy, pydantic, yaml]
      commands: [abinit]
      allowed_dependency_issue_patterns:
        - '^quantities 0\.12\.3 is not supported on this platform$'
        - '^gprof2dot 2017\.9\.19 is not supported on this platform$'
        - '^periodictable 1\.5\.2 is not supported on this platform$'
    backends: [abinit]

  lammps:
    conda_name: researchchem-lammps
    description: LAMMPS MPICH runtime isolated from the AmberTools/OpenFF environment.
    environment: .envs/kinetics-legacy
    conda_packages: [python=3.11, lammps=2024.08.29, mpich=4, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [lammps]
      commands: [lmp]
      allowed_dependency_issue_patterns:
        - '^quantities 0\.12\.3 is not supported on this platform$'
        - '^gprof2dot 2017\.9\.19 is not supported on this platform$'
        - '^periodictable 1\.5\.2 is not supported on this platform$'
    command_variables:
      CHEMGRAPH_LAMMPS_COMMAND: lmp
    backends: [lammps]

  gaussian:
    conda_name: researchchem-gaussian
    description: Licensed Gaussian 16 C.01 executable and formatted-checkpoint runtime.
    environment: .envs/general-modern-openmpi5
    conda_packages: [python=3.11, cclib]
    pip_packages: []
    health_checks:
      modules: [cclib]
      commands: [g16, formchk]
      external_commands:
        - .software_cache/gaussian/g16/install/g16/g16
        - .software_cache/gaussian/g16/install/g16/formchk
    command_variables:
      CHEMGRAPH_GAUSSIAN_COMMAND: .software_cache/gaussian/g16/install/g16/g16
      CHEMGRAPH_GAUSSIAN_FORMCHK_COMMAND: .software_cache/gaussian/g16/install/g16/formchk
    path_entries: [.software_cache/gaussian/g16/install/g16]
    cache_paths: [.software_cache/gaussian/g16]
    environment_variables:
      g16root: .software_cache/gaussian/g16/install
      GAUSS_EXEDIR: .software_cache/gaussian/g16/install/g16
      GAUSS_SCRDIR: .software_cache/gaussian/g16/scratch
    smoke_commands:
      - [bash, -c, 'grep -q "Normal termination of Gaussian 16" .software_cache/gaussian/g16/smoke/water.log']
    backends: [gaussian]

  gamess:
    conda_name: researchchem-gamess
    description: Registered GAMESS 15 Jul 2024 R2 Patch 1 sockets-DDI source build.
    environment: .envs/general-modern-openmpi5
    conda_packages: [gcc_linux-64, gfortran_linux-64, openblas, tcsh, jinja2]
    pip_packages: []
    health_checks:
      commands: [rungms]
      external_commands:
        - .software_cache/gamess/2024-r2-p1/source/rungms
        - .software_cache/gamess/2024-r2-p1/build/gamess.00.x
    command_variables:
      CHEMGRAPH_GAMESS_COMMAND: .software_cache/gamess/2024-r2-p1/source/rungms
    path_entries:
      - .software_cache/gamess/2024-r2-p1/source
      - .software_cache/gamess/2024-r2-p1/build
    library_path_entries: [.envs/general-modern-openmpi5/lib]
    cache_paths: [.software_cache/gamess/2024-r2-p1]
    environment_variables:
      GMS_PATH: .software_cache/gamess/2024-r2-p1/source
      GMS_BUILD_DIR: .software_cache/gamess/2024-r2-p1/build
      GMS_SCRATCH: .software_cache/gamess/2024-r2-p1/scratch
      GMS_RESTART: .software_cache/gamess/2024-r2-p1/restart
    smoke_commands:
      - [bash, -c, 'grep -q "EXECUTION OF GAMESS TERMINATED NORMALLY" .software_cache/gamess/2024-r2-p1/smoke/exam01.log']
    backends: [gamess]

  rmg:
    conda_name: researchchem-rmg
    description: RMG-Py 4.0.0 typed kinetics and tunneling runtime.
    environment: .envs/kinetics-legacy
    conda_packages: [rmg=4.0.0, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [rmgpy, pydantic, yaml]
      commands: [rmg.py]
      allowed_dependency_issue_patterns:
        - '^quantities 0\.12\.3 is not supported on this platform$'
        - '^gprof2dot 2017\.9\.19 is not supported on this platform$'
        - '^periodictable 1\.5\.2 is not supported on this platform$'
    cache_paths:
      - .software_cache/rmg/database/4.0.0/input
      - .software_cache/rmg/source/4.0.0
    environment_variables:
      HOME: .software_cache/rmg/home
    backends: [rmg]

  mess:
    conda_name: researchchem-mess
    description: MESS 2020.1.24 master-equation runtime for an Agent-supplied native reaction model.
    environment: .envs/general-modern-openmpi5
    conda_packages: [python=3.11, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [pydantic, yaml]
      commands: [mess]
      external_commands: [.software_cache/mess/2020.1.24/build/mess]
    command_variables:
      CHEMGRAPH_MESS_COMMAND: .software_cache/mess/2020.1.24/build/mess
    path_entries: [.software_cache/mess/2020.1.24/build]
    library_path_entries: [.envs/general-modern-openmpi5/lib]
    cache_paths: [.software_cache/mess/2020.1.24]
    environment_variables:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    smoke_commands:
      - [bash, -c, 'grep -q "rate calculation done" .software_cache/mess/smoke/hco/hco.log']
    backends: [mess]

  mesmer:
    conda_name: researchchem-mesmer
    description: MESMER 7.1 master-equation runtime for an Agent-supplied XML reaction model.
    environment: .envs/general-modern-openmpi5
    conda_packages: [python=3.11, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [pydantic, yaml]
      commands: [mesmer]
      external_commands: [.software_cache/mesmer/7.1/bin/mesmer]
    command_variables:
      CHEMGRAPH_MESMER_COMMAND: .software_cache/mesmer/7.1/bin/mesmer
    path_entries: [.software_cache/mesmer/7.1/bin]
    cache_paths: [.software_cache/mesmer/7.1]
    smoke_commands:
      - [bash, -c, 'grep -q "firstOrderRate" .software_cache/mesmer/smoke/examples/H2Ominimal/H2Ominimal.audit.xml']
    backends: [mesmer]

  sella:
    conda_name: researchchem-sella
    description: Sella 2.5.0 composite minimum/transition-state optimizer using an Agent-selected calculator backend.
    environment: .envs/kinetics-legacy
    conda_packages: [python=3.11, ase, pydantic, pyyaml, python-dotenv]
    pip_packages: [sella==2.5.0]
    health_checks:
      modules: [sella, ase, numpy, pydantic, yaml]
      allowed_dependency_issue_patterns:
        - '^quantities 0\.12\.3 is not supported on this platform$'
        - '^gprof2dot 2017\.9\.19 is not supported on this platform$'
        - '^periodictable 1\.5\.2 is not supported on this platform$'
    backends: [sella]

  namd:
    conda_name: researchchem-namd
    description: NAMD 3.0.2 multicore AVX-512 runtime; the CUDA bundle is cached but not selected automatically.
    environment: .envs/general-modern-openmpi5
    conda_packages: [python]
    pip_packages: []
    health_checks:
      commands: [namd3]
      external_commands:
        - .software_cache/namd/3.0.2/multicore-avx512/namd3
        - .software_cache/namd/3.0.2/multicore-cuda/namd3
    command_variables:
      CHEMGRAPH_NAMD_COMMAND: .software_cache/namd/3.0.2/multicore-avx512/namd3
    path_entries: [.software_cache/namd/3.0.2/multicore-avx512]
    cache_paths: [.software_cache/namd/3.0.2]
    smoke_commands:
      - [bash, -c, 'grep -q "End of program" .software_cache/namd/3.0.2/smoke/namd_smoke.log']
    backends: [namd]

  amber:
    conda_name: researchchem-amber
    description: Amber 26 licensed PMEMD CPU serial and OpenMPI executables.
    environment: .envs/general-modern-openmpi5
    conda_packages: [gcc_linux-64, gfortran_linux-64, cmake, openmpi, netcdf-fortran, fftw, bison]
    pip_packages: []
    health_checks:
      commands: [pmemd, pmemd.MPI, mpirun]
      external_commands:
        - .software_cache/amber/26/install/bin/pmemd
        - .software_cache/amber/26/install/bin/pmemd.MPI
    command_variables:
      CHEMGRAPH_AMBER_COMMAND: .software_cache/amber/26/install/bin/pmemd
      CHEMGRAPH_AMBER_MPI_COMMAND: .software_cache/amber/26/install/bin/pmemd.MPI
      CHEMGRAPH_AMBER_MPIRUN_COMMAND: .envs/general-modern-openmpi5/bin/mpirun
    path_entries: [.software_cache/amber/26/install/bin]
    library_path_entries:
      - .software_cache/amber/26/install/lib
      - .envs/general-modern-openmpi5/lib
    cache_paths: [.software_cache/amber/26]
    environment_variables:
      CHEMGRAPH_AMBER_MPI_EXECUTABLE: .software_cache/amber/26/install/bin/pmemd.MPI
      OMPI_ALLOW_RUN_AS_ROOT: '1'
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: '1'
    smoke_commands:
      - [bash, -c, 'grep -q "Amber 26 PMEMD" .software_cache/amber/26/smoke/gb7_trx_serial/mdout.trxox']
    backends: [amber_pmemd]

  charmm:
    conda_name: researchchem-charmm
    description: Academic CHARMM c50b2 serial/OpenMP GNU source build.
    environment: .envs/general-modern-openmpi5
    conda_packages: [python]
    pip_packages: []
    health_checks:
      commands: [charmm]
      external_commands: [.software_cache/charmm/50b2/install/bin/charmm]
    command_variables:
      CHEMGRAPH_CHARMM_COMMAND: .software_cache/charmm/50b2/install/bin/charmm
    path_entries: [.software_cache/charmm/50b2/install/bin]
    cache_paths: [.software_cache/charmm/50b2]
    smoke_commands:
      - [bash, -c, 'grep -q "NORMAL TERMINATION BY NORMAL STOP" .software_cache/charmm/50b2/smoke/h2otst.out']
    backends: [charmm]

profiles:
  core:
    conda_name: researchchem-core
    server_name: researchchem_core
    description: Core runtime for cheminformatics and deterministic analysis backends.
    environment: .envs/general-modern-openmpi5
    use_project_model_cache: true
    runtime_preload_libraries: [libstdc++.so.6, libgcc_s.so.1]
    health_checks:
      modules: [ase, numpy, pdbtools, rdkit, yaml]
      models:
        mace_medium_mpa_0:
          backend: mace_mp
          model: medium-mpa-0
          device: cpu
          default_dtype: float64
    backends:
      - rdkit
      - rdkit_etkdg
      - rdkit_gasteiger
      - internal_statistics
      - ase_emt
      - internal_vibrations
      - internal_spectroscopy
      - internal_thermochemistry
      - internal_reaction_analysis
      - pdb_tools

  services:
    conda_name: researchchem-services
    server_name: researchchem_services
    description: Remote scientific data services and authenticated materials lookup.
    environment: .envs/general-modern-openmpi5
    conda_packages: [mp-api]
    pip_packages: [pubchempy==1.0.5]
    health_checks:
      modules: [mp_api, pubchempy]
    backends:
      - pubchem
      - rcsb_pdb
      - materials_project
      - catalysis_hub
      - nist_webbook

  workflows:
    conda_name: researchchem-workflows
    server_name: researchchem_workflows
    description: Crystal structure, symmetry, and lightweight trajectory-analysis libraries.
    environment: .envs/general-modern-openmpi5
    conda_packages: [qcelemental=0.50.4, qcengine=0.50.0, cclib=1.8.1, pymatgen, spglib, mdtraj]
    pip_packages: []
    health_checks:
      modules: [qcelemental, qcengine, cclib, pymatgen, spglib, mdtraj]
    backends: [qcelemental, cclib, pymatgen, spglib, mdtraj]

  free_energy:
    conda_name: researchchem-free-energy
    server_name: researchchem_free_energy
    description: Explicit statistical free-energy estimation and alchemical analysis runtime.
    environment: .envs/molecular-simulation-openff
    conda_packages: [pymbar=4.2.0, alchemlyb=2.5.0, mdtraj, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [pymbar, alchemlyb, mdtraj]
    backends: [pymbar, alchemlyb, hoomd]

  quantum:
    conda_name: researchchem-quantum
    server_name: researchchem_quantum
    description: Molecular quantum chemistry and ASE calculation tools, including typed ORCA 6.1.1 correlated-density generation and density export; Psi4 remains isolated.
    environment: .envs/general-modern-openmpi5
    runtime_preload_libraries: [libstdc++.so.6, libgcc_s.so.1]
    conda_packages: [ase, xtb, openbabel]
    pip_packages: [pyscf, tblite==0.4.0, mace-torch==0.3.16]
    use_project_model_cache: true
    health_checks:
      modules: [ase, mace, mace.calculators, pyscf, tblite, torch]
      commands: [xtb, orca, mpirun]
      external_commands:
        - .software_cache/orca/6.1.1/orca
        - .software_cache/openmpi/4.1.8-fortran/bin/mpirun
      models:
        mace_medium_mpa_0:
          backend: mace_mp
          model: medium-mpa-0
          device: cpu
          default_dtype: float64
    command_variables:
      CHEMGRAPH_XTB_COMMAND: xtb
      CHEMGRAPH_ORCA_COMMAND: .software_cache/orca/6.1.1/orca
    prepend_path_entries:
      - .software_cache/orca/6.1.1
      - .software_cache/openmpi/4.1.8-fortran/bin
    prepend_library_path_entries:
      - .software_cache/openmpi/4.1.8-fortran/lib
    environment_variables:
      OPAL_PREFIX: .software_cache/openmpi/4.1.8-fortran
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,vader,tcp
    backends:
      - openbabel
      - xtb
      - pyscf
      - tblite
      - orca

  gpaw:
    conda_name: researchchem-gpaw
    server_name: researchchem_gpaw
    description: GPAW 25.7.0 molecular and periodic PAW-DFT runtime with locally managed setup datasets.
    environment: .envs/general-modern-openmpi5
    conda_packages: [gpaw=25.7.0, ase, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [gpaw, ase, numpy]
      commands: [gpaw]
    environment_variables:
      GPAW_SETUP_PATH: .software_cache/gpaw/setups
    cache_paths: [.software_cache/gpaw/setups]
    backends: [gpaw]

  critic2:
    conda_name: researchchem-source-runtime-critic2
    server_name: researchchem_critic2
    description: Critic2 1.2.1081 typed QTAIM critical-point analysis runtime.
    environment: .envs/general-modern-openmpi5
    conda_packages: [gfortran_linux-64, spglib]
    pip_packages: []
    health_checks:
      commands: [critic2]
      external_commands: [.software_cache/critic2/install-conda/bin/critic2]
    command_variables:
      CHEMGRAPH_CRITIC2_COMMAND: .software_cache/critic2/install-conda/bin/critic2
    path_entries: [.software_cache/critic2/install-conda/bin]
    cache_paths: [.software_cache/critic2/install-conda]
    backends: [critic2]

  lobster:
    conda_name: researchchem-lobster
    description: Licensed LOBSTER 5.1.0 periodic bonding and projected-DOS postprocessing runtime.
    environment: .envs/general-modern-openmpi5
    conda_packages: [pymatgen, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [pymatgen, numpy, pydantic, yaml]
      commands: [lobster-5.1.0]
      external_commands:
        - .software_cache/lobster/5.1.0/package/lobster-5.1.0
    command_variables:
      CHEMGRAPH_LOBSTER_COMMAND: .software_cache/lobster/5.1.0/package/lobster-5.1.0
    path_entries: [.software_cache/lobster/5.1.0/package]
    cache_paths: [.software_cache/lobster/5.1.0]
    smoke_commands:
      - [bash, -c, 'grep -q "finished in" .software_cache/lobster/5.1.0/smoke/qe_diamond/lobsterout']
    backends: [lobster]

  shengbte:
    conda_name: researchchem-shengbte
    description: ShengBTE source revision b0d2090 for Agent-supplied phonon-BTE models.
    environment: .envs/general-modern-openmpi5
    conda_packages: [openmpi, spglib, lapack, blas, gfortran_linux-64, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [pydantic, yaml]
      commands: [ShengBTE]
      external_commands: [.software_cache/shengbte/source/ShengBTE]
    command_variables:
      CHEMGRAPH_SHENGBTE_COMMAND: .software_cache/shengbte/source/ShengBTE
    path_entries: [.software_cache/shengbte/source]
    library_path_entries: [.envs/general-modern-openmpi5/lib]
    cache_paths: [.software_cache/shengbte/source]
    smoke_commands:
      - [bash, -c, 'grep -q "normal exit" .software_cache/shengbte/source/Test-RTA/BTE.smoke.out']
    backends: [shengbte]

  openmolcas:
    conda_name: researchchem-openmolcas
    description: OpenMolcas v25.10 molecular SCF runtime with typed HF/DFT property adapters.
    environment: .envs/general-modern-openmpi5
    conda_packages: [gfortran_linux-64, pyparsing, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [pydantic, yaml]
      commands: [pymolcas]
      external_commands: [.software_cache/openmolcas/25.10/pymolcas]
    command_variables:
      CHEMGRAPH_OPENMOLCAS_COMMAND: .software_cache/openmolcas/25.10/pymolcas
    path_entries:
      - .software_cache/openmolcas/25.10
      - .software_cache/openmolcas/25.10/bin
    library_path_entries:
      - .software_cache/openmolcas/25.10/lib
      - .envs/general-modern-openmpi5/lib
    cache_paths:
      - .software_cache/openmolcas/source
      - .software_cache/openmolcas/25.10
    environment_variables:
      MOLCAS: .software_cache/openmolcas/25.10
      MOLCAS_WORKDIR: .software_cache/openmolcas/work
    smoke_commands:
      - [bash, -c, 'grep -q "Total SCF energy.*-1.1167593075" .software_cache/openmolcas/smoke.log && grep -q "Happy landing" .software_cache/openmolcas/smoke.log']
    backends: [openmolcas]

  multiwfn:
    conda_name: researchchem-multiwfn
    description: Multiwfn 2026.7.15 noGUI typed wavefunction, density-grid, and electron-isodensity-surface analysis runtime.
    environment: .envs/general-modern-openmpi5
    conda_packages: [python=3.11, pydantic, pyyaml, python-dotenv]
    pip_packages: []
    health_checks:
      modules: [pydantic, yaml]
      commands: [Multiwfn_noGUI]
      external_commands:
        - .software_cache/multiwfn/2026.7.15/Multiwfn_2026.7.15_bin_Linux_noGUI/Multiwfn_noGUI
    command_variables:
      CHEMGRAPH_MULTIWFN_COMMAND: .software_cache/multiwfn/2026.7.15/Multiwfn_2026.7.15_bin_Linux_noGUI/Multiwfn_noGUI
    path_entries:
      - .software_cache/multiwfn/2026.7.15/Multiwfn_2026.7.15_bin_Linux_noGUI
    cache_paths: [.software_cache/multiwfn/2026.7.15]
    environment_variables:
      OMP_STACKSIZE: 2G
    smoke_commands:
      - [bash, -c, 'cd .software_cache/multiwfn/2026.7.15/Multiwfn_2026.7.15_bin_Linux_noGUI && printf "q\n" | ./Multiwfn_noGUI examples/H2.fch | grep -q "Loaded examples/H2.fch successfully"']
    backends: [multiwfn]

  nwchem:
    conda_name: researchchem-nwchem
    server_name: researchchem_nwchem
    description: NWChem 7.3.x single-geometry QCSchema runtime with local official basis libraries.
    environment: .envs/general-modern-openmpi5
    conda_packages: [nwchem=7.3.1, qcengine=0.50.0, qcelemental=0.50.4, cclib, pydantic, pyyaml, python-dotenv]
    pip_packages: [autode=1.4.5, geometric==1.1.1]
    health_checks:
      modules: [qcengine, qcelemental, cclib, numpy, geometric]
      commands: [nwchem]
    environment_variables:
      NWCHEM_BASIS_LIBRARY: .software_cache/nwchem/source/src/basis/libraries/
    cache_paths: [.software_cache/nwchem/source/src/basis/libraries]
    backends: [nwchem, geometric]

  psi4:
    conda_name: researchchem-psi4
    server_name: researchchem_psi4
    description: Isolated Psi4 Python runtime.
    environment: .envs/general-modern-openmpi5
    conda_packages: [psi4]
    pip_packages: []
    health_checks:
      modules: [psi4]
      commands: [psi4]
    backends: [psi4]

  goodvibes:
    conda_name: researchchem-goodvibes
    server_name: researchchem_goodvibes
    description: Isolated GoodVibes 4.3.0 thermochemistry, ensemble, selectivity, validation, and reaction-profile runtime.
    environment: .envs/general-modern-openmpi5
    conda_packages: [python=3.11, pydantic, pyyaml, python-dotenv]
    pip_packages: ['goodvibes[full]==4.3.0']
    health_checks:
      modules: [goodvibes, numpy, pandas, pyarrow, yaml]
      commands: [goodvibes]
    command_variables:
      CHEMGRAPH_GOODVIBES_COMMAND: goodvibes
    cache_paths: [.software_cache/goodvibes/4.3.0/source]
    smoke_commands:
      - [goodvibes, --help]
    backends: [goodvibes]

  reaction:
    conda_name: researchchem-reaction
    server_name: researchchem_reaction
    description: Conformer refinement, reaction paths, and kinetics.
    environment: .envs/kinetics-legacy
    conda_packages: [xtb, crest, cantera]
    pip_packages:
      - pysisyphus==1.0.0
      - pyscf==2.13.1
    health_checks:
      modules: [cantera, pysisyphus, pyscf, scipy]
      commands: [crest, pysis, xtb, orca, mpirun]
      allowed_dependency_issue_patterns:
        - '^quantities 0\.12\.3 is not supported on this platform$'
        - '^gprof2dot 2017\.9\.19 is not supported on this platform$'
        - '^periodictable 1\.5\.2 is not supported on this platform$'
      external_commands:
        - .software_cache/orca/6.1.1/orca
        - .software_cache/openmpi/4.1.8-fortran/bin/mpirun
    command_variables:
      CHEMGRAPH_CREST_COMMAND: crest
      CHEMGRAPH_PYSIS_COMMAND: pysis
    prepend_path_entries:
      - .software_cache/orca/6.1.1
      - .software_cache/openmpi/4.1.8-fortran/bin
    prepend_library_path_entries:
      - .software_cache/openmpi/4.1.8-fortran/lib
    environment_variables:
      OPAL_PREFIX: .software_cache/openmpi/4.1.8-fortran
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,vader,tcp
    backends:
      - crest
      - pysisyphus
      - cantera
      - scipy

