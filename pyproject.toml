[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchchembench"
version = "0.2.0"
description = "Agent-agnostic benchmark for autonomous chemistry research tools."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "mcp>=1.0",
    "fastmcp>=2.0",
    "numexpr>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
chemistry = [
    "ase>=3.22",
    "mace-torch",
    "numpy==1.26.4",
    "onnxruntime>=1.17",
    "pubchempy==1.0.5",
    "pymatgen",
    "rdkit",
    "tblite==0.4.0; python_version < '3.13' or platform_system != 'Darwin'",
    "tokenizers>=0.15",
]

[project.scripts]
researchchembench = "evaluation.server:main"
researchchembench-eval = "evaluation.cli_eval:main"
researchchem-mcp-server = "chemistry_toolbox.mcp.server:main"

[tool.setuptools.packages.find]
where = [".", "chemistry_toolbox/src"]
include = ["evaluation*", "chemistry_toolbox*", "researchchem_toolbox*"]
exclude = [
    "chemistry_toolbox.src*",
    "chemistry_toolbox.build*",
    "chemistry_toolbox.mcp.build*",
    "chemistry_toolbox.scripts*",
    "chemistry_toolbox.tests*",
    "evaluation.mcp_tools*",
]

[tool.setuptools.package-data]
evaluation = [
    "agents.json",
    ".env.example",
    "requirements*.txt",
    "templates/*.html",
    "static/*",
    "static/logos/*",
]
"chemistry_toolbox.mcp" = [
    "tool_config.json",
    "TOOL_CATALOG.md",
    "README.md",
    "install.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests", "chemistry_toolbox/tests"]
markers = [
    "integration: requires optional chemistry calculator dependencies",
    "agent: invokes an installed external agent CLI",
]
